# ~/.config/picom.conf
# Balanced GLX configuration with light blur
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

# Basic fading
fading = true;
fade-delta = 3;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dropdown_menu'"
];

# Lightweight blur
blur: {
  method = "kernel";
  size = 5;
  deviation = 1.0;
  kernel = "3x3box";
  
  background = false;      # Only blur transparent windows
  background-frame = false;
  background-fixed = false;
  
  exclude = [
    "class_g = 'i3-frame'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
    "class_g ~= 'slop'",
  ];
};

# Performance optimizations
use-damage = true;
xrender-sync-fence = true;

# Window type rules
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; blur = false; };
  dropdown_menu = { opacity = 0.95; blur = true; };
  popup_menu = { opacity = 0.95; blur = true; };
};

# Disable unwanted effects
shadow = false;
corner-radius = 0;
detect-rounded-corners = false;
