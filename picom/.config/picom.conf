# ~/.config/picom.conf
# Balanced GLX configuration with light blur

backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

# Basic fading
fading = true;
fade-delta = 3;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dropdown_menu'"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 3;

blur-background-exclude = [
  "name *= 'slop'",
  "class_g ~= 'slop'",
  "class_g ~= 'maim'",
  "class_i ~= 'maim'",
  "name ~= 'maim'",
  "window_type = 'desktop'",
  "window_type = 'popup_menu'",
  "window_type = 'menu'",
  "_GTK_FRAME_EXTENTS@:c"
];

focus-exclude = [
  "class_g ~= 'maim'",
  "class_i ~= 'maim'",
  "name ~= 'maim'"
];

# Performance optimizations
use-damage = true;
xrender-sync-fence = true;

# Disable unwanted effects
shadow = false;
corner-radius = 0;
detect-rounded-corners = false;
