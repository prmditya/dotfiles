# ~/.config/picom.conf
# Balanced GLX configuration with light blur
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

# Basic fading
fading = true;
fade-delta = 3;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dropdown_menu'"
];

# Performance optimizations
use-damage = true;
xrender-sync-fence = true;

# Disable unwanted effects
shadow = false;
corner-radius = 0;
detect-rounded-corners = false;
