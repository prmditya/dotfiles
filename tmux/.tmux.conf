# Set the prefix to Ctrl+a
unbind C-b # Unbind the default Ctrl+b
set -g prefix C-a # Set the new prefix to Ctrl+a
bind C-a send-prefix # Send Ctrl+a to the application when pressed twice

# Set default terminal for 256-color and true-color support.
# These lines are crucial for color schemes to display correctly.
set -g default-terminal "tmux-256color"
set-option -ga terminal-features ",xterm-256color:RGB"

# Enable mouse mode (optional, but very convenient)
set -g mouse on

# Increase scrollback buffer history
set -g history-limit 5000

# Set vi-style keys for copy mode
set-window-option -g mode-keys vi

# Copy to system clipboard (requires xclip or xsel on Linux, or reattach-to-user-namespace on macOS)
# Linux:
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Smart pane switching with vim-tmux-navigator (requires plugin manager)
# It's better to let the 'christoomey/vim-tmux-navigator' plugin handle these if it's enabled.
# If you don't use the plugin, uncomment these lines.
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# --------------------------------------------------------------------------
# TMUX PLUGIN MANAGER (TPM) CONFIGURATION
# --------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # Common sense defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto save/restore with interval
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless navigation between vim and tmux panes
set -g @plugin 'wfxr/tmux-power'                # Themes

# --- tmux-power Configuration  ---
# See https://github.com/wfxr/tmux-power for more options.
# tmux-power relies on your terminal's color palette for theming.
set -g @tmux_power_theme 'gold' # 'sky' is the default and often looks good with Gruvbox, but try others.
                               # Other options: 'gold', 'moon', 'forest', 'snow', 'rose', 'nord', 'catppuccin'
                               # 'sky' uses the terminal's default colors, which is what we want for Gruvbox integration.
set -g @tmux_power_show_upload_speed false
set -g @tmux_power_show_download_speed false
set -g @tmux_power_date_format '%H:%M %d-%b-%y' # Consistent date/time format
set -g @tmux_power_full_path true # Show full path in current directory section
set -g @tmux_power_user_icon 'U:' # Example: custom icon for user section
set -g @tmux_power_session_icon 'S:' # Example: custom icon for session section
set -g @tmux_power_left_args '[#{?client_prefix,#[fg=yellow,bold]!,}#S]' # Adds prefix highlight to session
set -g @tmux_power_right_args '' # No custom right arguments for now

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'