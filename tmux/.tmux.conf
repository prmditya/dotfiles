# Set the prefix to Ctrl+a
unbind C-b # Unbind the default Ctrl+b
set -g prefix C-a # Set the new prefix to Ctrl+a
bind C-a send-prefix # Send Ctrl+a to the application when pressed twice

# Set default terminal for 256-color and true-color support.
# These lines are crucial for color schemes to display correctly.
set -g default-terminal "tmux-256color"
set-option -ga terminal-features ",xterm-256color:RGB"

# Enable mouse mode (optional, but very convenient)
set -g mouse on

# Increase scrollback buffer history
set -g history-limit 5000

# Set vi-style keys for copy mode
set-window-option -g mode-keys vi

# Copy to system clipboard (requires xclip or xsel on Linux, or reattach-to-user-namespace on macOS)
# Linux:
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# --------------------------------------------------------------------------
# TMUX PLUGIN MANAGER (TPM) CONFIGURATION
# --------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # Common sense defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto save/restore with interval
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless navigation between vim and tmux panes
set -g @plugin 'egel/tmux-gruvbox'              # Themes

# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
set -g @tmux-gruvbox-left-status-a '#S' # tmux's session name
set -g @tmux-gruvbox-right-status-x '%m/%d/%Y' # e.g.: 01/31/2024
set -g @tmux-gruvbox-right-status-y '%I:%M %p' # 09:54 PM
set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'