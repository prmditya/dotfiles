;===========================================;
;         Minimalist Polybar Config        ;
;===========================================;

[colors]
background = #282828
foreground = #EBDBB2
accent = #D79921
alert = #CC241D

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 25
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = CaskaydiaCove Nerd Font:size=10:antialias=true;3

separator = " | "

padding-left = 1
padding-right = 2

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory pulseaudio network battery

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.background}
label-active-underline= ${colors.accent}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d
time = %H:%M
label = %date% %time%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
label = %percentage_used%%

[module/pulseaudio]
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>
label-volume = %percentage%%
format-muted =  Muted

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

[module/network]
type = internal/network
interface = wlan0
interval = 2

format-connected = <ramp-signal>  <label-connected>
format-disconnected = <label-disconnected>

label-connected = %essid%
label-disconnected =  OFF
label-disconnected-foreground = ${colors.warning}

; Using Nerd Font wifi icons
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-foreground = ${colors.secondary}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = ⚡  <label-charging>
format-discharging = <ramp-capacity>  <label-discharging>
format-full =   <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL

; Simbol baterai Nerd Font
ramp-capacity-0 =   ; 0-20%
ramp-capacity-1 =   ; 20-40%
ramp-capacity-2 =   ; 40-60%
ramp-capacity-3 =   ; 60-90%
ramp-capacity-4 =   ; 90-100%

animation-charging-0 = ⚡
animation-charging-1 = 

[settings]
screenchange-reload = true
