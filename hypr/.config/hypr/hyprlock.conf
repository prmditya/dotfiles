# ~/.config/hypr/hyprlock.conf

# General settings
general {
    disable_loading_bar = true
    no_fade_in = false
}

# Background: Will be dynamically updated by your script
background {
    path = /home/ditya/Pictures/Wallpapers/ship-2.jpg
    blur_passes = 3
    blur_size = 7
    darken = 0.3
    color = rgb(282828) # fallback background
}

# Input field with static Gruvbox colors
input-field {
    monitor = 
    size = 200, 50
    outline_thickness = 2
    dots_center = true

    dot_color = rgb(ebdbb2)           # Gruvbox light fg
    inner_color = rgba(40,40,40,0.07) # Gruvbox bg with transparency
    outer_color = rgb(d79921)         # Gruvbox yellow
    text_color = rgb(ebdbb2)
    placeholder_text = Type Password...
    font_size = 20
    font_family = CaskaydiaCove Nerd Font Mono
    check_color = rgb(98971a)         # Gruvbox green
    fail_color = rgb(cc241d)          # Gruvbox red
}
