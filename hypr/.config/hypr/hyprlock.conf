# ~/.config/hypr/hyprlock.conf

# General settings for the lock screen
general {
    disable_loading_bar = true # Hides the loading bar
    no_fade_in = false         # Allows a fade-in animation
    # no_fade_out = false      # Allows a fade-out animation
    # hide_cursor = true       # Hides the cursor after a short delay
}

# Background Layer (Most important for your blur/wallpaper)
background {
    path = ~/Pictures/Wallpapers/mbeek.jpg # IMPORTANT: Set this to your wallpaper's path

    # Blur settings (adjust size and passes for desired effect)
    blur_passes = 3 # Number of blur passes (higher = more blur, more resource-intensive)
    # blur_size = 7 # Blur radius/strength (higher = more blur)

    # Darkening effect (0.0 is no darkening, 1.0 is completely black)
    darken = 0.3 # Darken the blurred wallpaper by 30%

    # Optional: Fill color if wallpaper path is invalid or not found
    color = rgb(282828) # Your Gruvbox background color as a fallback
}

# Optional: Input Field (where you type your password)
 input-field {
    monitor = # or set a specific monitor for the input field
    size = 200, 50
    outline_thickness = 2
    dots_center = true

    # Color of the dots
    dot_color = rgb(ebdbb2) # Example: Gruvbox foreground color for the dots

    # Color when dots are "darkened" (e.g., after a wrong password attempt)
    # This color should be defined using rgba for proper transparency/blending if needed.

    # Other input field colors you already had (for the field itself)
    inner_color = rgba(28282811) # Your transparent inner color
    outer_color = rgb(d79921)   # Gruvbox yellow/orange for the outline

    text_color = rgb(ebdbb2) # Color of the password text typed
    placeholder_text = Type Password...
    font_size = 20
    font_family = CaskaydiaCove Nerd Font Mono
    check_color = rgb(98971a) # Gruvbox green for success
    fail_color = rgb(cc241d) # Gruvbox red for failure
 }
