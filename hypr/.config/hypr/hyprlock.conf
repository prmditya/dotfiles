# ~/.config/hypr/hyprlock.conf

# --- Sources ---
source = ~/.config/hypr/colors-hyprland.conf

# General settings
general {
    disable_loading_bar = true
    no_fade_in = false
}

# Background: Will be dynamically updated by your script
background {
    path = /home/ditya/Pictures/Wallpapers/sunset.jpg
    blur_passes = 3
    blur_size = 7
    darken = 0.3
    color = $background
}

# Input field with static Gruvbox colors
input-field {
    monitor = 
    size = 200, 50
    outline_thickness = 2
    dots_center = true

    dot_color = $foreground           # Gruvbox light fg
    text_color = $foreground
    placeholder_text = Type Password...
    font_size = 20
    font_family = CaskaydiaCove Nerd Font Mono
    check_color = $color13         # Gruvbox green
    fail_color = $color14          # Gruvbox red
}
