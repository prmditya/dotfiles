# Please see https://wiki.hyprland.org/Configuring/Config/ for a complete reference!

# --- General Settings ---
# Main modifier key (Super/Windows key)
$mainMod = SUPER

# Set initial execs (autostart programs)
# Use exec-once to run commands only once when Hyprland starts

# Set wallpaper with hyprpaper
exec-once = hyprpaper

# Xresources are X11 specific, not used in Wayland.
# exec-once = xrdb -merge ~/.Xresources

# Auth daemon for GUI app to be able request elevated privileges
exec-once = systemctl --user start hyprpolkitagent

# Wlsunset for color temperature
exec-once = wlsunset -t 5000 -T 5100 -d 1 -l -7.4475 -L 112.7153

# Keyboard layout options (equivalent to setxkbmap)
input {
    kb_options = ctrl:nocaps
    # You might also want to set your keyboard layout here, e.g.:
    # kb_layout = us # or "id" for Indonesian
    # kb_variant =
    # kb_model =
}

# Reload configuration
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Waybar for status bar
# Ensure ~/.config/waybar/config modules are updated (hyprland/workspaces, hyprland/window)
exec-once = waybar

# Network Manager Applet (runs via Xwayland)
exec-once = nm-applet

# Dunst for notifications (runs via Xwayland)
exec-once = dunst

# Start the cliphist daemon for clipboard persistence
exec-once = cliphist daemon

# Start the hypridle daemon for comprehensive idle management
exec-once = hypridle

# General settings for Hyprland
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 1 # Corresponds to border pixel 1 for all windows by default
    col.active_border = rgb(d79921) # $gruv_yellow (active window border)
    col.inactive_border = rgb(282828) # $gruv_bg (inactive window border)
}

# Decoration settings (for blur, shadows, rounded corners)
decoration {
    blur {
        enabled = true
        size = 5 # Blur intensity (higher = more blur)
        passes = 1 # Number of blur passes (more = heavier blur, higher perf impact)
        new_optimizations = true
    }
}

layerrule = blur, waybar

# Animations (basic setup, customize as desired)
animations {
    enabled = true

    # Define a custom bezier curve for smoother animations if desired
    bezier = myBezier, 0.05, 0.5, 0.1, 1.05

    # Example animations
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

# Input device settings (mouse, touchpad, keyboard)
input {
    # Your floating_modifier $mod is implicitly handled by bind commands.
    # See https://wiki.hyprland.org/Configuring/Variables/#input
    sensitivity = 0.8
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# Monitor configuration (your laptop LVDS-1 as primary, VGA-1 as external right of it)
# monitor = <name>, <resolution>@<refresh>, <position_x>x<position_y>, <scale>
monitor = LVDS-1, 1366x768@60, 0x0, 1 # Your laptop screen
monitor = VGA-1, 1366x768@59.790, 1366x0, 1 # Your external monitor, to the right of laptop

env = XCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

# --- Keybindings ---
# General format: bind = <MODIFIER(S)>, <KEY>, <DISPATCHER>, <ARGS>
# See https://wiki.hyprland.org/Configuring/Binds/ for dispatcher list

# Restart Waybar
bind = $mainMod SHIFT, B, exec, killall waybar && waybar

# Start a terminal
bind = $mainMod, Return, exec, wezterm # Corresponds to bindsym $mod+Return exec wezterm

# Kill focused window
bind = $mainMod SHIFT, Q, killactive, # Corresponds to bindsym $mod+Shift+q kill

# Start wofi (program launcher)
bind = $mainMod, D, exec, wofi --show drun # Corresponds to bindsym $mod+d exec --no-startup-id wofi -show drun
bind = $mainMod, Space, exec, wofi --show combi # Corresponds to bindsym $mod+space exec --no-startup-id wofi -show combi
bind = $mainMod, Tab, exec, wofi --show window # Corresponds to bindsym $mod+Tab exec --no-startup-id wofi -show window

# Change focus (movefocus dispatcher)
bind = $mainMod, H, movefocus, l # Corresponds to bindsym $mod+h focus left
bind = $mainMod, J, movefocus, d # Corresponds to bindsym $mod+j focus down
bind = $mainMod, K, movefocus, u # Corresponds to bindsym $mod+k focus up
bind = $mainMod, L, movefocus, r # Corresponds to bindsym $mod+l focus right
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Move focused window (movewindow dispatcher)
bind = $mainMod SHIFT, H, movewindow, l # Corresponds to bindsym $mod+Shift+h move left
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Enter fullscreen mode
bind = $mainMod, F, fullscreen, # Corresponds to bindsym $mod+f fullscreen toggle

# Change container layout (Hyprland's layouts are `dwindle` and `master`)
# Note: Sway's stacking/tabbed have no direct Hyprland equivalent.
# These binds will likely switch between dwindle and master layouts, or do nothing.
bind = $mainMod, E, togglefloating, # No direct equivalent to toggle split, this will toggle float instead

# Toggle tiling / floating
bind = $mainMod SHIFT, Space, togglefloating, # Corresponds to bindsym $mod+Shift+space floating toggle

# Focus the parent container - No direct equivalent in Hyprland's default dispatchers.
# bind = $mainMod, A, focus parent # This functionality isn't directly available like in i3/Sway.

# Lock screen
bind = $mainMod SHIFT, BackSpace, exec, hyprlock
# Suspend with lock
bind = $mainMod SHIFT, S, exec, systemctl suspend && hyprlock

# --- Workspace Management ---
# Hyprland manages workspaces directly by number.
# Dispatcher: workspace <number> (switch), movetoworkspace <number> (move window)

# Switch to workspace
bind = $mainMod, 1, workspace, 1 # Corresponds to bindsym $mod+1 workspace number $ws1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move focused container to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Corresponds to bindsym $mod+Shift+1 move container to workspace number $ws1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Reload configuration
bind = $mainMod SHIFT, C, exec, hyprctl reload # Corresponds to bindsym $mod+Shift+c reload
# Restart Hyprland (logs out)
bind = $mainMod SHIFT, R, exit, # Corresponds to bindsym $mod+Shift+r restart (Hyprland's restart is typically 'exit')
# Exit Hyprland (logs you out)
bind = $mainMod SHIFT, E, exit, # Corresponds to bindsym $mod+Shift+e exec "i3-nagbar ..."

# Resize window mode (Hyprland uses submaps, similar to modes)
bind = $mainMod, R, submap, resize

submap = resize
    # These bindings trigger as soon as you enter the resize mode
    # Pressing left will shrink the window’s width.
    bind = , J, resizeactive, -10 0
    bind = , K, resizeactive, 0 10
    bind = , L, resizeactive, 0 -10
    bind = , semicolon, resizeactive, 10 0

    # same bindings, but for the arrow keys
    bind = , Left, resizeactive, -10 0
    bind = , Down, resizeactive, 0 10
    bind = , Up, resizeactive, 0 -10
    bind = , Right, resizeactive, 10 0

    # back to normal: Enter or Escape or $mod+r
    bind = , Return, submap, reset
    bind = , Escape, submap, reset
    bind = $mainMod, R, submap, reset
submap = reset # Resets the submap mode

binds {
    drag_threshold = 10
}
bindm = ALT, mouse:272, movewindow
bindc = ALT, mouse:272, togglefloating

# --- Media Keys ---
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Screenshot Keybindings ---
# Fullscreen screenshot to file (~/Pictures/Screenshots/)
bind = , Print, exec, grim "/home/$USER/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
# Select region screenshot to file
bind = $mainMod, Print, exec, grim -g "$(slurp)" "/home/$USER/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
# Select region screenshot to Swappy for annotation
# Requires swappy to be installed: yay -S swappy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -

# TODO: FIX THIS TO WORK
# --- Clipboard Screenshots ---
# Fullscreen screenshot to clipboard
bind = CTRL, Print, exec, grim -o | wl-copy -t image/png
# Select region screenshot to clipboard
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" -o | wl-copy -t image/png

# --- Clipboard History Management ---
# Paste from cliphist history via wofi
# Requires cliphist to be running as a daemon: exec-once = cliphist daemon
# Requires wofi to be installed: sudo pacman -S wofi
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
