# Hyprland Configuration
# See https://wiki.hyprland.org/Configuring/Config/

# --- Sources ---
source = ~/.config/hypr/hyprland-colors.conf

# --- Variables ---
$mainMod = SUPER

# --- Startup Applications ---
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = wlsunset -t 5000 -T 5100 -d 1 -l -7.4475 -L 112.7153
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
exec-once = dunst
exec-once = cliphist daemon
exec-once = hypridle

# --- Environment Variables ---
env = XCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

# --- Monitor Configuration ---
monitor = LVDS-1, 1366x768@60, 0x0, 1
monitor = VGA-1, 1366x768@59.790, 1366x0, 1

workspace = 1,monitor:LVDS-1
workspace = 2,monitor:VGA-1
workspace = 3,monitor:VGA-1
workspace = 4,monitor:VGA-1
workspace = 5,monitor:VGA-1
workspace = 6,monitor:VGA-1
workspace = 7,monitor:VGA-1
workspace = 8,monitor:VGA-1
workspace = 9,monitor:VGA-1
workspace = 10,monitor:VGA-1

# --- Input Configuration ---
input {
    kb_options = ctrl:nocaps
    sensitivity = 0.4
    follow_mouse = 1
    accel_profile = flat
    touchpad {
        natural_scroll = false
    }
}

# --- General Settings ---
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 1
    resize_on_border = 1
}

# --- Decoration ---
decoration {
  blur {
      enabled = true
      size = 5
      passes = 1
      contrast = 0.4
      vibrancy_darkness = 0.5
      new_optimizations = true
      popups = false
      popups_ignorealpha = 0.3
  }
}

layerrule = blur, waybar

# --- Animations ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.5, 0.1, 1.05
    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 0, 5, default
}

# --- Keybindings ---

# System
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exit
bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, B, exec, killall waybar && waybar

# Applications
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, W, exec, ~/scripts/pick-wallpaper.sh

# Window Management
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, E, togglefloating
bind = $mainMod SHIFT, Space, togglefloating

# Focus Movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Window Movement
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Resize Mode
bind = $mainMod, R, submap, resize
submap = resize
    bind = , J, resizeactive, -30 0
    bind = , K, resizeactive, 0 30
    bind = , L, resizeactive, 0 -30
    bind = , semicolon, resizeactive, 30 0
    bind = , Left, resizeactive, -30 0
    bind = , Down, resizeactive, 0 30
    bind = , Up, resizeactive, 0 -30
    bind = , Right, resizeactive, 30 0
    bind = , Return, submap, reset
    bind = , Escape, submap, reset
    bind = $mainMod, R, submap, reset
submap = reset

# Gaps Bindings
bind = ALT G, equal, exec, sh ~/scripts/gaps-keybind.sh --turn-on-gaps
bind = ALT G, minus, exec, sh ~/scripts/gaps-keybind.sh --turn-off-gaps

# Mouse Bindings
binds {
    drag_threshold = 10
}
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindc = $mainMod, mouse:272, togglefloating

# Security
bind = $mainMod SHIFT, BackSpace, exec, hyprlock
bind = $mainMod SHIFT, S, exec, systemctl suspend && hyprlock

# Media Keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots
env = SCREENSHOT_DIR, /home/$USER/Pictures/Screenshots

bind = , Print, exec, grim "$SCREENSHOT_DIR/$(date '+%Y-%m-%d_%H-%M-%S').png" && notify-send "📸 Screenshot saved"
bind = $mainMod, p, exec, grim -g "$(slurp)" "$SCREENSHOT_DIR/$(date '+%Y-%m-%d_%H-%M-%S').png" && notify-send "📸 Area screenshot saved"
bind = $mainMod SHIFT, p, exec, grim -g "$(slurp)" - | swappy -f - && notify-send "🖍️ Screenshot opened in Swappy"

# Output screenshot to clipboard
bind = CTRL, Print, exec, grim - | wl-copy --type image/png && notify-send "📋 Screenshot copied to clipboard"
bind = $mainMod CTRL, p, exec, grim -g "$(slurp)" - | wl-copy --type image/png && notify-send "📋 Area screenshot copied to clipboard"

# Clipboard History
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && notify-send "📋 Clipboard item selected"
