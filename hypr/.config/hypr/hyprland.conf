# Hyprland Configuration
# See https://wiki.hyprland.org/Configuring/Config/

# --- Variables ---
$mainMod = SUPER

# --- Startup Applications ---
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = wlsunset -t 5000 -T 5100 -d 1 -l -7.4475 -L 112.7153
exec-once = waybar
exec-once = nm-applet
exec-once = blueman-applet
exec-once = dunst
exec-once = cliphist daemon
exec-once = hypridle

# --- Environment Variables ---
env = XCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_THEME,rose-pine-hyprcursor

# --- Monitor Configuration ---
monitor = LVDS-1, 1366x768@60, 0x0, 1
monitor = VGA-1, 1366x768@59.790, 1366x0, 1

# --- Input Configuration ---
input {
    kb_options = ctrl:nocaps
    sensitivity = 0.8
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# --- General Settings ---
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 1
    col.active_border = rgb(d79921)
    col.inactive_border = rgb(282828)
    resize_on_border = 1
}

# --- Decoration ---
decoration {
  blur {
      enabled = true
      size = 3
      passes = 2
      new_optimizations = true
  }
}

layerrule = blur, waybar

# --- Animations ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.5, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

# --- Keybindings ---

# System
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exit
bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, B, exec, killall waybar && waybar

# Applications
bind = $mainMod, Return, exec, wezterm
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, Space, exec, wofi --show combi
bind = $mainMod, Tab, exec, wofi --show window

# Window Management
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, E, togglefloating
bind = $mainMod SHIFT, Space, togglefloating

# Focus Movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Window Movement
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Resize Mode
bind = $mainMod, R, submap, resize
submap = resize
    bind = , J, resizeactive, -30 0
    bind = , K, resizeactive, 0 30
    bind = , L, resizeactive, 0 -30
    bind = , semicolon, resizeactive, 30 0
    bind = , Left, resizeactive, -30 0
    bind = , Down, resizeactive, 0 30
    bind = , Up, resizeactive, 0 -30
    bind = , Right, resizeactive, 30 0
    bind = , Return, submap, reset
    bind = , Escape, submap, reset
    bind = $mainMod, R, submap, reset
submap = reset

# Mouse Bindings
binds {
    drag_threshold = 10
}
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow
bindc = ALT, mouse:272, togglefloating

# Security
bind = $mainMod SHIFT, BackSpace, exec, hyprlock
bind = $mainMod SHIFT, S, exec, systemctl suspend && hyprlock

# Media Keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots
bind = , Print, exec, grim "/home/$USER/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
bind = $mainMod, Print, exec, grim -g "$(slurp)" "/home/$USER/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = CTRL, Print, exec, grim -o | wl-copy -t image/png
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" -o | wl-copy -t image/png

# Clipboard History
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
